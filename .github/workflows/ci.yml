name: CI

# Checks the version is the same everywhere (scripts/check-version.sh) and that the plugin
# builds. Runs on pushes to main, and first in every release (release.yml).

on:
  push:
    branches: [main]
  workflow_call: # the release workflow runs this first

permissions:
  contents: read

jobs:
  build:
    name: Version check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: The version is the same everywhere
        run: bash scripts/check-version.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build -c Release -warnaserror
